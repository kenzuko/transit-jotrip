name: Update Transit Snapshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "collector/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-transit.yml"
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-transit.yml"

permissions:
  contents: write

concurrency:
  group: transit-snapshot
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Collect public transit data
        run: python collector/collect.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/network.json", encoding="utf-8"))
          assert p["schema_version"] == "1.1"
          assert "departures" in p and "services" in p
          for row in p["departures"]:
              if row.get("data_kind") == "operational_public":
                  assert row.get("date_specific") is True
          print("ready", p["ready"])
          print("departures", len(p["departures"]))
          print("services", len(p["services"]))
          print("health", p["health"]["status"])
          PY
      - name: Commit changed snapshot
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/network.json; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "jotrip-transit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/network.json
          git commit -m "data: refresh transit snapshot"
          git push
