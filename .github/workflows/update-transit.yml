name: Update Transit Snapshot

on:
  workflow_dispatch:
  # External authenticated schedulers may use this event once explicitly authorized.
  # GitHub schedule remains best-effort; data freshness is still independently fail-visible.
  repository_dispatch:
    types: [transit_refresh]
  pull_request:
    branches: [main]
    paths:
      - "collector/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-transit.yml"
  schedule:
    # Avoid the high-contention minute 0/30; the independent watchdog probes at :22/:52.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-transit.yml"

permissions:
  contents: write

concurrency:
  group: transit-snapshot
  # Do not discard an in-progress source collection on a delayed scheduled tick.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Collect public transit data
        run: python collector/collect.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/network.json", encoding="utf-8"))
          h=json.load(open("data/health.json", encoding="utf-8"))
          assert p["schema_version"] == "1.1"
          assert h["schema_version"] == "transit-health-v1"
          assert h["generated_at"] == p["generated_at"]
          assert h["ready"] == p["ready"]
          assert h["summary"]["departures"] == len(p["departures"])
          assert h["summary"]["services"] == len(p["services"])
          assert "departures" in p and "services" in p
          public_blob=json.dumps(p, ensure_ascii=False)
          assert "source_url" not in public_blob, "public snapshot must not expose source URLs"
          assert "date_specific_booking" not in public_blob, "public snapshot must not expose collection mechanics"
          for row in p["departures"]:
              if row.get("data_kind") == "operational_public":
                  assert row.get("date_specific") is True
              assert "NoOfRemain" not in row, "seat inventory must not be persisted"
              assert "_internal_trip_id" not in row and "tripId" not in row, "internal trip id leaked"
          pqe=[r for r in p["departures"] if r.get("operator")=="Phú Quốc Express"]
          pqe_state=(p.get("sources",{}).get("registry",{}).get("phu_quoc_express") or {})
          if pqe:
              assert all(r.get("date_specific") is True for r in pqe)
              assert any((r.get("fare") or {}).get("adult") for r in pqe), "Phú Quốc Express fare missing"
              assert all("NoOfRemain" not in r for r in pqe), "seat inventory must not be persisted"
              print("pqe_rows", len(pqe))
              print("pqe_sample", {k:pqe[0].get(k) for k in ("origin","destination","departure_time","vessel_or_service","fare","vehicle_cargo")})
          else:
              assert pqe_state.get("status") in {"error","empty"}, f"unexpected PQE state: {pqe_state}"
              print("pqe_rows", 0, "status", pqe_state.get("status"))
          sd=[r for r in p["departures"] if r.get("operator")=="Superdong"]
          sd_state=(p.get("sources",{}).get("registry",{}).get("superdong") or {})
          if sd:
              assert all(r.get("date_specific") is True for r in sd)
              assert all("NoOfRemain" not in r and "NoOfSeat" not in r for r in sd), "Superdong seat inventory leaked"
              assert any((r.get("fare") or {}).get("adult") for r in sd), "Superdong fare missing"
              print("superdong_rows", len(sd))
              print("superdong_sample", {k:sd[0].get(k) for k in ("origin","destination","departure_time","vessel_or_service","fare")})
          else:
              assert sd_state.get("status") in {"error","empty"}, f"unexpected Superdong state: {sd_state}"
              print("superdong_rows", 0, "status", sd_state.get("status"))
          ba=[r for r in p["departures"] if r.get("operator")=="Bình An"]
          ba_state=(p.get("sources",{}).get("registry",{}).get("binh_an") or {})
          if ba:
              assert all(r.get("mode")=="FERRY" for r in ba)
              assert all(r.get("date_specific") is True for r in ba)
              assert all("_internal_trip_id" not in r and "tripId" not in r for r in ba)
              assert any((r.get("fare") or {}).get("adult") for r in ba), "Bình An fare missing"
              print("binhan_rows", len(ba))
              print("binhan_sample", {k:ba[0].get(k) for k in ("origin","destination","departure_time","arrival_time","fare")})
          else:
              assert ba_state.get("status") in {"error","empty"}, f"unexpected Bình An state: {ba_state}"
              print("binhan_rows", 0, "status", ba_state.get("status"))
          import pathlib
          history_files=list(pathlib.Path("data/history/binhan").glob("*.jsonl"))
          assert history_files, "Bình An history snapshot missing"
          latest=history_files[-1]
          for line in latest.read_text(encoding="utf-8").splitlines():
              h=json.loads(line)
              blob=json.dumps(h, ensure_ascii=False).lower()
              for forbidden in ("tripid","_internal_trip_id","phone","telephone","licenseplates","sessionid","booking_code","customer"):
                  assert forbidden not in blob, f"forbidden history field: {forbidden}"
          print("binhan_history", str(latest))
          print("ready", p["ready"])
          print("departures", len(p["departures"]))
          print("services", len(p["services"]))
          print("health", p["health"]["status"])
          PY
      - name: Commit changed snapshot
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/network.json data/health.json data/history/binhan; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "jotrip-transit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/network.json data/health.json data/history/binhan
          git commit -m "data: refresh transit snapshot"
          # A delayed collector cannot push an older observation over a newer
          # successful collector. Keep unrelated concurrent main edits.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! node --input-type=module - <<'NODE'
          import {execFileSync} from "node:child_process";
          import {readFileSync} from "node:fs";
          const next=JSON.parse(readFileSync("data/health.json","utf8"));
          const old=JSON.parse(execFileSync("git",["show","origin/main:data/health.json"],{encoding:"utf8"}));
          const t=value=>Date.parse(value?.generated_at||"");
          const nextTime=t(next),oldTime=t(old);
          if(!Number.isFinite(nextTime)||!Number.isFinite(oldTime))throw Error("Unverifiable Transit release timestamp");
          if(nextTime<=oldTime){console.error("Older/equal Transit snapshot; refuse to publish stale run");process.exit(1);}
          console.log("Transit snapshot time advances",next.generated_at);
          NODE
            then
              echo "::notice::A newer or equal Transit snapshot already exists; no stale publish"
              exit 0
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Concurrent snapshot conflict; refuse force-push or data overwrite"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Transit newer verified snapshot published"
              exit 0
            fi
          done
          echo "::error::Transit snapshot was not publishable after retries"
          exit 1
