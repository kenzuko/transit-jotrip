name: Diagnostic - Seat field keys

on:
  push:
    branches:
      - "diag/seat-field-keys-20260922"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public booking response field names only
        run: |
          python - <<'PY'
          import requests, json
          UA={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/plain,*/*"}

          def dump(label,url,params,session=None):
              s=session or requests.Session()
              r=s.get(url,params=params,headers=UA,timeout=20)
              print(label,"status",r.status_code,"ctype",r.headers.get("content-type"))
              r.raise_for_status()
              data=r.json()
              if isinstance(data,list):
                  print(label,"count",len(data))
                  if data and isinstance(data[0],dict):
                      print(label,"keys",sorted(data[0].keys()))
              elif isinstance(data,dict):
                  print(label,"keys",sorted(data.keys()))
                  for k,v in data.items():
                      if isinstance(v,list) and v and isinstance(v[0],dict):
                          print(label,"nested_list",k,"keys",sorted(v[0].keys()))
                          break

          dump(
              "PQE",
              "https://online.phuquocexpress.com/Booking/SearchVoyage",
              {"RouteId":3,"DepartDate":"2026-09-23","NoOfPassenger":1}
          )

          s=requests.Session()
          s.headers.update({
              "User-Agent":"Mozilla/5.0",
              "Accept":"application/json,text/javascript,*/*;q=0.01",
              "X-Requested-With":"XMLHttpRequest",
              "Referer":"https://online.superdong.com.vn/Booking",
          })
          s.get("https://online.superdong.com.vn/Booking",headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.superdong.com.vn/"},timeout=20)
          r=s.get("https://online.superdong.com.vn/api/Boat/getBoat",params={"RouteId":3,"DepartDate":"2026-09-23","NoOfPassenger":1},timeout=20)
          print("SUPERDONG","status",r.status_code,"ctype",r.headers.get("content-type"))
          r.raise_for_status()
          data=r.json()
          print("SUPERDONG","count",len(data) if isinstance(data,list) else "dict")
          if isinstance(data,list) and data and isinstance(data[0],dict):
              print("SUPERDONG","keys",sorted(data[0].keys()))
          elif isinstance(data,dict):
              print("SUPERDONG","keys",sorted(data.keys()))
          # Inspect Phu Quoc Express booking JavaScript for public boat/capacity calls.
          html=requests.get("https://online.phuquocexpress.com/",headers={"User-Agent":"Mozilla/5.0"},timeout=20).text
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          soup=BeautifulSoup(html,"html.parser")
          scripts=[urljoin("https://online.phuquocexpress.com/",x.get("src")) for x in soup.find_all("script") if x.get("src")]
          print("PQE script_count",len(scripts))
          for u in scripts:
              try:
                  body=requests.get(u,headers={"User-Agent":"Mozilla/5.0"},timeout=20).text
              except Exception:
                  continue
              low=body.lower()
              if "searchvoyage" in low or "noofremain" in low or "noofseat" in low or "boattype" in low:
                  print("PQE relevant_script",u)
                  for line in body.splitlines():
                      ll=line.lower()
                      if any(k in ll for k in ("searchvoyage","noofremain","noofseat","boattype","boatid")):
                          cleaned=" ".join(line.strip().split())
                          if len(cleaned)>500: cleaned=cleaned[:500]
                          print("PQE js",cleaned)
          PY
