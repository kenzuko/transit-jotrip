name: Probe Official Booking Requests

on:
  push:
    branches: ["feat/date-first-transit-data-v2"]
    paths:
      - "collector/probe_booking.py"
      - ".github/workflows/probe-booking.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser probe
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Probe booking search network
        run: python collector/probe_booking.py
